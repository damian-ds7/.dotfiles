set -g default-terminal "${TERM}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Config for nvim images plugin
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Change prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# pane / window numbering
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# Pane resize
bind-key -r h resize-pane -L 5
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r l resize-pane -R 5

# Windows navigation
bind-key -n BTab last-window

# Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

set -g exit-empty off
set -g mouse on
setw -g mode-keys vi

set-option -g status-position top

set-window-option -g visual-bell on
set-window-option -g bell-action other

bind -n M-H previous-window
bind -n M-L next-window
bind | split-window -h
bind - split-window -v
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind K confirm kill-session
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

#unbind -n MouseDown3Pane

bind-key a run-shell -b '
  tmux select-window -t :AI 2>/dev/null || \
  tmux new-window -n AI "opencode --continue"
'
set -g remain-on-exit off

# Change plugin install dir
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'lost-melody/tmux-command-palette'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-floax'

TMUX_FZF_LAUNCH_KEY="M-F"
set -g @plugin 'sainnhe/tmux-fzf'

source-file ~/.config/themes/current/tmux.conf

# Catppuccin config
#set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_status_style "custom"

set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_overlay_2}]#[bg=#{@thm_overlay_1},fg=#{@thm_bg}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_surface_0}]█"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_surface_1}]█"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_surface_1}]"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_status_background "none"

set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(󰛭),}"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text " #( echo \#{pane_current_path} | sed \"s|$HOME|~|\" )"

set -g @catppuccin_pane_border_style "fg=#45475a"
set -g @catppuccin_pane_active_border_style "fg=#f38ba8"

set -g status-right-length 200
set -g status-left ""
set -g  status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Install tpm if not present
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
