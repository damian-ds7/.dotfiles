# --- Vague Color Overrides for Catppuccin ---
set -g @thm_bg "#141415"          # bg
set -g @thm_fg "#cdcdcd"          # fg
set -g @thm_surface_0 "#1c1c24"   # inactiveBg
set -g @thm_surface_1 "#252530"   # line
set -g @thm_surface_2 "#606079"   # comment
set -g @thm_overlay_0 "#878787"   # floatBorder
set -g @thm_overlay_1 "#333738"   # visual
set -g @thm_overlay_2 "#aeaed1"   # constant (right separator)

# Accents
set -g @thm_mauve "#f3be7c"       # warning (current window, like the official vague-tmux)
set -g @thm_red "#d8647e"         # error
set -g @thm_teal "#b4d4cf"        # builtin
set -g @thm_yellow "#e8b589"      # string
set -g @thm_blue "#6e94b2"        # keyword
set -g @thm_pink "#bb9dbd"        # parameter

set -g @catppuccin_pane_border_style "fg=#606079"        # comment
set -g @catppuccin_pane_active_border_style "fg=#f3be7c" # warning
