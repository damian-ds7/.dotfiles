# --- Rosé Pine Dawn Color Overrides for Catppuccin ---
set -g @thm_bg "#faf4ed"          # Base (Warm White)
set -g @thm_fg "#575279"          # Text (Deep Purple-Grey)
set -g @thm_surface_0 "#fffaf3"   # Surface
set -g @thm_surface_1 "#f2e9e1"   # Overlay
set -g @thm_surface_2 "#9893a5"   # Muted
set -g @thm_overlay_0 "#797593"   # Subtle
set -g @thm_overlay_1 "#dfdad9"   # Highlight Med
set -g @thm_overlay_2 "#907aa9"   # Iris

# Accents (Using Rose for the active/mauve highlight as requested)
set -g @thm_mauve "#d7827e"       # Rose (Warm Pinkish-Gold)
set -g @thm_red "#b4637a"         # Love
set -g @thm_teal "#286983"        # Pine
set -g @thm_yellow "#ea9d34"      # Gold
set -g @thm_blue "#56949f"        # Foam
set -g @thm_pink "#d7827e"        # Rose

# Updated pane borders for Light Mode
set -g @catppuccin_pane_border_style "fg=#9893a5"        # Muted
set -g @catppuccin_pane_active_border_style "fg=#d7827e" # Rose
