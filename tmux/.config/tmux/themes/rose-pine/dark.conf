# --- Rosé Pine Color Overrides for Catppuccin ---
set -g @thm_bg "#191724"          # Base
set -g @thm_fg "#e0def4"          # Text
set -g @thm_surface_0 "#1f1d2e"   # Surface
set -g @thm_surface_1 "#26233a"   # Overlay
set -g @thm_surface_2 "#6e6a86"   # Muted
set -g @thm_overlay_0 "#908caa"   # Subtle
set -g @thm_overlay_1 "#524f67"   # Highlight High
set -g @thm_overlay_2 "#c4a7e7"   # Iris (Used for your right separator)

# Accents
set -g @thm_mauve "#ebbcba"       # Rose (Used for your 'current' window highlight)
set -g @thm_red "#eb6f92"         # Love (Used for urgent/panes)
set -g @thm_teal "#31748f"        # Pine
set -g @thm_yellow "#f6c177"      # Gold
set -g @thm_blue "#9ccfd8"        # Foam
set -g @thm_pink "#ebbcba"        # Rose

# Fix for your specific pane border settings
set -g @catppuccin_pane_border_style "fg=#6e6a86"        # Muted
set -g @catppuccin_pane_active_border_style "fg=#ebbcba" # Rose
