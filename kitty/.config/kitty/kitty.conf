include themes/current-theme

tab_bar_edge            top
tab_bar_style           custom
tab_bar_margin_height   4 0
tab_bar_background      none
tab_bar_margin_color    none

font_family       JetBrainsMono Nerd Font
font_size         12.0
font_features     JetBrainsMonoNFM-Regular +liga +calt +dlig
disable_ligatures cursor
modify_font       cell_height 120%

window_padding_width 8

cursor_blink_interval 0

notify_on_cmd_finish unfocused
shell_integration    enabled

clipboard_control write-clipboard write-primary read-clipboard read-primary-ask

confirm_os_window_close 0

enabled_layouts splits,stack

map --when-focus-on "not cmdline:tmux" alt+s>c new_tab_with_cwd
map --when-focus-on "not cmdline:tmux" alt+s>n next_tab
map --when-focus-on "not cmdline:tmux" alt+s>p previous_tab
map --when-focus-on "not cmdline:tmux" alt+s>shift+x close_tab

map --when-focus-on "not cmdline:tmux" alt+s>1 goto_tab 1
map --when-focus-on "not cmdline:tmux" alt+s>2 goto_tab 2
map --when-focus-on "not cmdline:tmux" alt+s>3 goto_tab 3
map --when-focus-on "not cmdline:tmux" alt+s>4 goto_tab 4
map --when-focus-on "not cmdline:tmux" alt+s>6 goto_tab 6
map --when-focus-on "not cmdline:tmux" alt+s>7 goto_tab 7
map --when-focus-on "not cmdline:tmux" alt+s>8 goto_tab 8
map --when-focus-on "not cmdline:tmux" alt+s>9 goto_tab 9

map --when-focus-on "not cmdline:tmux" alt+s>shift+backslash launch --location=vsplit --cwd=current
map --when-focus-on "not cmdline:tmux" alt+s>backslash       launch --location=vsplit --cwd=current
map --when-focus-on "not cmdline:tmux" alt+s>minus           launch --location=hsplit --cwd=current

map --when-focus-on "not cmdline:tmux" alt+s>x close_window

map --when-focus-on "not cmdline:tmux" alt+s>z toggle_layout stack

map --when-focus-on "not cmdline:tmux" alt+s>h neighboring_window left
map --when-focus-on "not cmdline:tmux" alt+s>j neighboring_window down
map --when-focus-on "not cmdline:tmux" alt+s>k neighboring_window up
map --when-focus-on "not cmdline:tmux" alt+s>l neighboring_window right

map --when-focus-on "not cmdline:tmux" alt+s>alt+s send_text all \x1bs

map --when-focus-on "not cmdline:tmux" alt+shift+l next_tab
map --when-focus-on "not cmdline:tmux" alt+shift+h previous_tab
