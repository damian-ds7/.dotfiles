[input.keyboard]
layout = "pl"
options = "caps:escape_shifted_capslock"

[input.touchpad]
tap = true
disable_while_typing = true
natural_scroll = true
click_method = "clickfinger"
sensitivity = 0.8
accel_profile = "flat"

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.8
