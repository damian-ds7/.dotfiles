# Generated by noctalia from templates/tmux.conf, overrides the catppuccin plugin's colors
set -g @thm_bg "{{ colors.terminal_background.default.hex }}"
set -g @thm_fg "{{ colors.terminal_foreground.default.hex }}"
set -g @thm_surface_0 "{{ colors.surface_container_low.default.hex }}"
set -g @thm_surface_1 "{{ colors.surface_container_high.default.hex }}"
set -g @thm_surface_2 "{{ colors.outline.default.hex }}"
set -g @thm_overlay_0 "{{ colors.on_surface_variant.default.hex }}"
set -g @thm_overlay_1 "{{ colors.outline_variant.default.hex }}"
set -g @thm_overlay_2 "{{ colors.secondary.default.hex }}" # right separator

# Accents
set -g @thm_mauve "{{ colors.primary.default.hex }}" # current window
set -g @thm_red "{{ colors.terminal_normal_red.default.hex }}"
set -g @thm_teal "{{ colors.terminal_normal_cyan.default.hex }}"
set -g @thm_yellow "{{ colors.terminal_normal_yellow.default.hex }}"
set -g @thm_blue "{{ colors.terminal_normal_blue.default.hex }}"
set -g @thm_pink "{{ colors.terminal_normal_magenta.default.hex }}"

set -g @catppuccin_pane_border_style "fg={{ colors.outline.default.hex }}"
set -g @catppuccin_pane_active_border_style "fg={{ colors.primary.default.hex }}"
