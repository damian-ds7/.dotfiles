[bar]
order = ["top"]

[bar.top]
position = "top"
enabled = false
smart_auto_hide = true
reserve_space = false
layer = "top"

thickness = 44
background_opacity = 0.7
shadow = true
contact_shadow = false
panel_overlap = 1
radius = 20
margin_ends = 180
margin_edge = 10
padding = 14
widget_spacing = 13
scale = 1.1
font_weight = 700
font_family = ""

capsule = false

start = ["noctalia/umbriel-companion:bar", "workspaces", "media"]
center = ["clock_top", "notifications"]
end = ["tray", "network", "bluetooth", "volume", "battery"]

[bar.top.monitor.eDP-1]
enabled = true

[bar.top.monitor."VG240Y"]
enabled = true
smart_auto_hide = false
reserve_space = true
margin_ends = 0
margin_edge = 0
radius = 0
radius_bottom_right = 12
radius_bottom_left = 12

[bar.side]
position = "left"
enabled = false
auto_hide = false
# niri struts keep tiles clear instead, so floating coords stay screen-relative
reserve_space = false
layer = "top"

thickness = 44
background_opacity = 0.7
shadow = true
contact_shadow = false
panel_overlap = 1
radius = 0
concave_edge_corners = true
radius_top_right = 12
radius_bottom_right = 12
margin_ends = 0
margin_edge = 0
padding = 14
widget_spacing = 13
scale = 1.1
font_weight = 700
font_family = ""

capsule = false

start = ["noctalia/umbriel-companion:bar", "workspaces", "media"]
center = ["clock_side", "notifications"]
end = ["tray", "network", "bluetooth", "volume", "battery"]

[bar.side.monitor."VG27A"]
enabled = true

[widget.clock_top]
type = "clock"
format = "{:%e %h %H:%M}"

[widget.clock_side]
type = "clock"
format = "{:%e %h - %H:%M}"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.volume]
show_label = false

[widget.workspaces]
show_labels = false
pill_scale = 0.9

[widget.media]
hide_when_no_media = true

[widget.battery]
display_mode = "glyph"
