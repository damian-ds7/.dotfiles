[audio]
enable_overdrive = false
enable_sounds = true
sound_volume = 1.0

[backdrop]
enabled = false

[wallpaper]
enabled = false

[wallpaper.automation]
enabled = false


[brightness]
enable_ddcutil = false

[desktop_widgets]
enabled = false

[dock]
enabled = false

[lockscreen]
enabled = false

[keybinds]
cancel = [ "escape" ]
down = [ "down" ]
left = [ "left" ]
right = [ "right" ]
up = [ "up" ]
validate = [ "return", "kp_enter" ]

[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000
use_weather_location = true

[notification]
background_opacity = 0.7
enable_daemon = true
layer = "top"
position = "top_center"

[osd]
position = "bottom_center"
background_opacity = 0.7

[system.monitor]
enabled = true

[location]
auto_locate = true

[weather]
enabled = true
refresh_minutes = 30
unit = "metric"
effects = true
