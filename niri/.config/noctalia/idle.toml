[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 3

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 180

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 240

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 300
