# Theming
font: JetBrainsMono Nerd Font 12
separator: " ➜ "
border_width: 2
corner_r: 12
padding: 15 # Defaults to corner_r
column_padding: 25 # Defaults to padding

# Colors
background: "#191724e6"
color: "#e0def4"
border: "#ebbcba"

# Anchor and margin
anchor: center # One of center, left, right, top, bottom, bottom-left, top-left, etc.
# Only relevant when anchor is not center
margin_right: 8
margin_bottom: 8
margin_left: 0
margin_top: 0

# Permits key bindings that conflict with compositor key bindings.
# Default is `false`.
inhibit_compositor_keyboard_shortcuts: false

# Try to guess the correct keyboard layout to use. Default is `false`.
auto_kbd_layout: true

menu:
  - key: "a"
    desc: Apps
    submenu:
      - key: "t"
        desc: Terminal (Ghostty + tmux)
        cmd: ghostty -e ~/.local/bin/ghostty-default-tmux +new-window
      - key: "T"
        desc: Terminal (Ghostty)
        cmd: ghostty +new-window
      - key: "b"
        desc: Browser (Zen)
        cmd: ~/.cargo/bin/nirius focus-or-spawn -a zen --workspace-name browser ~/.local/bin/zen
      - key: "B"
        desc: Browser (Zen - Private Window)
        cmd: ~/.local/bin/zen --private-window
      - key: "e"
        desc: Files (Nautilus)
        cmd: nautilus
      - key: "y"
        desc: Files (Yazi)
        cmd: ~/.local/bin/ghostty-yazi
      - key: "n"
        desc: Neovim
        cmd: ghostty --title=Neovim -e nvim +new-window
      - key: "i"
        desc: IntelliJ IDEA
        cmd: ~/.local/share/JetBrains/Toolbox/apps/intellij-idea/bin/idea -Dawt.toolkit.name=WLToolkit
      - key: "c"
        desc: VS Code
        cmd: code --enable-features=UseOzonePlatform --ozone-platform=wayland
      - key: "p"
        desc: Neovim edit popup
        cmd: ~/.local/bin/nvim-edit-popup
      - key: "m"
        desc: Music (Deezer)
        cmd: ~/.local/bin/focus-or-spawn-deezer
      - key: "r"
        desc: Resources
        cmd: flatpak run net.nokyan.Resources

  - key: "u"
    desc: UI
    submenu:
      - key: "w"
        desc: Weekly calendar
        cmd: qs ipc call plugin:weekly-calendar togglePanel
      - key: "c"
        desc: Control center
        cmd: qs ipc call controlCenter toggle
      - key: "n"
        desc: Notification center
        cmd: qs ipc call notifications toggleHistory
      - key: "N"
        desc: Clear notifications
        cmd: qs ipc call notifications clear
      - key: "b"
        desc: Toggle bar
        cmd: qs ipc call bar toggle
      - key: "B"
        desc: Toggle battery panel
        cmd: qs ipc call battery togglePanel
      - key: ","
        desc: Settings
        cmd: qs ipc call settings toggle

  - key: "v"
    desc: Vicinae
    submenu:
      - key: "v"
        desc: Launcher
        cmd: vicinae toggle
      - key: "c"
        desc: Clipboard history
        cmd: vicinae vicinae://extensions/vicinae/clipboard/history
      - key: "w"
        desc: Switch windows
        cmd: vicinae vicinae://extensions/vicinae/wm/switch-windows
      - key: "e"
        desc: Emoji search
        cmd: vicinae vicinae://extensions/vicinae/core/search-emojis

  - key: "s"
    desc: System
    submenu:
      - key: "a"
        desc: Audio
        submenu:
          - key: "p"
            desc: Audio panel
            cmd: qs ipc call volume togglePanel
          - key: "m"
            desc: Mute output
            cmd: qs ipc call volume muteOutput
          - key: "M"
            desc: Mute input
            cmd: qs ipc call volume muteInput

      - key: "c"
        desc: Capture
        submenu:
          - key: "r"
            desc: Toggle screen recorder
            cmd: qs ipc call plugin:screen-recorder toggle
          - key: "s"
            desc: Screenshot (area, no pointer)
            cmd: niri msg action screenshot --show-pointer=false
          - key: "f"
            desc: Screenshot (full screen)
            cmd: niri msg action screenshot-screen
          - key: "w"
            desc: Screenshot (window)
            cmd: niri msg action screenshot-window

      - key: "n"
        desc: Network
        submenu:
          - key: "n"
            desc: Network panel
            cmd: qs ipc call network togglePanel
          - key: "w"
            desc: Wi-Fi toggle
            cmd: qs ipc call wifi toggle
          - key: "b"
            desc: Bluetooth toggle
            cmd: qs ipc call bluetooth toggle
          - key: "B"
            desc: Bluetooth panel
            cmd: qs ipc call bluetooth togglePanel

      - key: "l"
        desc: Lock screen
        cmd: hyprlock
      - key: "m"
        desc: Toggle Dark/Light mode
        cmd: niri msg action do-screen-transition --delay-ms=500; ~/.local/bin/toggle-dark-mode
      - key: "s"
        desc: Change color scheme
        cmd: ~/.local/bin/vicinae-colorscheme-selector
      - key: "d"
        desc: Toggle DND
        cmd: qs ipc call notifications toggleDND
      - key: "i"
        desc: Toggle auto suspend (idle inhibitor)
        cmd: qs ipc call idleInhibitor toggle

  - key: "p"
    desc: Power
    submenu:
      - key: "s"
        desc: Suspend
        cmd: systemctl suspend
      - key: "r"
        desc: Reboot
        cmd: systemctl reboot
      - key: "p"
        desc: Power off
        cmd: systemctl poweroff
      - key: "m"
        desc: Power off monitors
        cmd: niri msg action power-off-monitors

  - key: "w"
    desc: Window
    submenu:
      - key: "l"
        desc: Layout
        submenu:
          - key: "o"
            desc: Overview
            cmd: niri msg action toggle-overview
          - key: "c"
            desc: Close window
            cmd: niri msg action close-window
          - key: "t"
            desc: Toggle tabbed columns
            cmd: niri msg action toggle-column-tabbed-display
          - key: "f"
            desc: Toggle floating
            cmd: niri msg action toggle-window-floating
          - key: "F"
            desc: Switch focus floating/tiling
            cmd: niri msg action switch-focus-between-floating-and-tiling
          - key: "["
            desc: Consume/expel left
            cmd: niri msg action consume-or-expel-window-left
          - key: "]"
            desc: Consume/expel right
            cmd: niri msg action consume-or-expel-window-right

      - key: "r"
        desc: Resize
        submenu:
          - key: "p"
            desc: Next column width preset
            cmd: niri msg action switch-preset-column-width
            keep_open: true
          - key: "P"
            desc: Next window height preset
            cmd: niri msg action switch-preset-window-height
          - key: "0"
            desc: Reset window height
            cmd: niri msg action reset-window-height
          - key: "-"
            desc: Column width -10%
            cmd: niri msg action set-column-width -- "-10%"
          - key: "="
            desc: Column width +10%
            cmd: niri msg action set-column-width -- "+10%"
          - key: "_"
            desc: Window height -10%
            cmd: niri msg action set-window-height -- "-10%"
          - key: "+"
            desc: Window height +10%
            cmd: niri msg action set-window-height -- "+10%"

      - key: "m"
        desc: Maximize
        submenu:
          - key: "c"
            desc: Maximize column
            cmd: niri msg action maximize-column
          - key: "e"
            desc: Maximize window to edges
            cmd: niri msg action maximize-window-to-edges
          - key: "f"
            desc: Fullscreen window
            cmd: niri msg action fullscreen-window
          - key: "x"
            desc: Expand column to available width
            cmd: niri msg action expand-column-to-available-width

      - key: "v"
        desc: View
        submenu:
          - key: "c"
            desc: Center column
            cmd: niri msg action center-column
          - key: "C"
            desc: Center visible columns
            cmd: niri msg action center-visible-columns
          - key: "f"
            desc: Toggle follow mode
            cmd: ~/.local/bin/nirius-follow-mode

      - key: "s"
        desc: Sidebar
        submenu:
          - key: "t"
            desc: Toggle window in sidebar
            cmd: ~/.local/bin/niri-sidebar-wrapper toggle-window
          - key: "v"
            desc: Toggle sidebar visibility
            cmd: ~/.local/bin/niri-sidebar-wrapper toggle-visibility
          - key: "f"
            desc: Flip sidebar order
            cmd: ~/.local/bin/niri-sidebar-wrapper flip
          - key: "r"
            desc: Reorder sidebar
            cmd: ~/.local/bin/niri-sidebar-wrapper reorder
          - key: "o"
            desc: Focus sidebar
            cmd: ~/.local/bin/niri-sidebar-wrapper focus

